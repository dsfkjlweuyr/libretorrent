name: Build Android APKs

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Base APKs (v8a/v7a/universal/x86/x86_64)
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Configure release signing (optional)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat <<EOF > key.properties
          storeFile=keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "No signing secrets configured; building unsigned release APKs."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --no-daemon assembleBaseDebug
          else
            ./gradlew --no-daemon assembleBaseRelease
          fi

      - name: Verify all 5 architecture APKs exist
        run: |
          APK_DIR="app/build/outputs/apk/base/${BUILD_TYPE}"
          ls -lh "$APK_DIR"
          for abi in arm64-v8a armeabi-v7a universal x86 x86_64; do
            if ! compgen -G "${APK_DIR}/*-${abi}-*.apk" > /dev/null; then
              echo "Missing APK for ABI: ${abi}"
              exit 1
            fi
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: libretorrent-arm64-v8a
          path: app/build/outputs/apk/base/${{ env.BUILD_TYPE }}/*-arm64-v8a-*.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: libretorrent-armeabi-v7a
          path: app/build/outputs/apk/base/${{ env.BUILD_TYPE }}/*-armeabi-v7a-*.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: libretorrent-universal
          path: app/build/outputs/apk/base/${{ env.BUILD_TYPE }}/*-universal-*.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: libretorrent-x86
          path: app/build/outputs/apk/base/${{ env.BUILD_TYPE }}/*-x86-*.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: libretorrent-x86_64
          path: app/build/outputs/apk/base/${{ env.BUILD_TYPE }}/*-x86_64-*.apk
          if-no-files-found: error
